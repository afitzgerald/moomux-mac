name: Test

# A change to nothing but these builds nothing new, so it runs nothing — and
# since Deploy follows this workflow, a docs-only merge cuts no release.
# Named rather than `**/*.md`: THIRD_PARTY_NOTICES.md ships inside both apps.
on:
  pull_request:
    paths-ignore: &docs
      - "docs/**"
      - README.md
      - CLAUDE.md
  push:
    branches:
      - main
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One debug build (selfcheck, which doubles as the warnings gate), one
  # release build (`make app`) and the iOS bundle, each on its own runner. The
  # three share no build output — debug, release and the iOS triple each
  # compile every dependency from scratch — so one job ran them back to back
  # for ~7 minutes, and three run side by side in the time of the slowest.
  # macOS runners cost nothing on a public repo. No macOS version matrix —
  # SwiftUI/AppKit APIs used here (Package.swift pins .macOS(.v14)) aren't
  # available on older runners, and there's only one platform this app ships
  # for.
  selfcheck:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Debug, not release: -O deletes every `assert`, which is the whole
      # selfcheck mechanism (see Scripts/selfcheck.sh). SelfTest itself
      # refuses to run under -O rather than reporting a hollow pass, so this
      # would fail loudly rather than silently if it were ever built wrong.
      #
      # This is also the zero-warnings gate (the standing rule in CLAUDE.md):
      # the debug build is the first one on a fresh checkout, so it is a clean
      # build and every file's diagnostics are emitted. That only holds while
      # nothing before this step builds — swift build re-emits diagnostics
      # solely for the files it recompiles.
      - name: Selfcheck, warnings as errors
        run: make selfcheck SWIFT_BUILD_FLAGS="-Xswiftc -warnings-as-errors"

  app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Confirms a release build still produces a working, ad-hoc-signed
      # bundle — the shape release.yml ships. Not a substitute for selfcheck,
      # which needs the debug build to keep its asserts.
      - name: Release build + app bundle
        run: make app

      # The Bundle.module crash (0.0.38, 0.0.163) is invisible on a build
      # machine, where SwiftPM's baked-in .build fallback path resolves. Move
      # every .bundle out of the bin path and launch the shipped bundle:
      # --warm-check exits 0 only if warm() resolved every bundle.
      - name: Bundle resolves without .build
        run: |
          set -euo pipefail
          bin=$(swift build -c release --build-system swiftbuild --show-bin-path)
          mkdir -p "$RUNNER_TEMP/moved"
          mv "$bin"/*.bundle "$RUNNER_TEMP/moved/"
          .build/Moomux.app/Contents/MacOS/Moomux --warm-check

  ios:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `Sources/MoomuxiOS` is not a SwiftPM target — it is compiled by a bare
      # `swiftc` in `make ios` — so neither macOS job type-checks a line of it.
      # Without this a phone-only file can break and every other check stays
      # green.
      #
      # Use the same Xcode release as testflight.yml. `make ios` finds the
      # simulator SDK through xcrun.
      - name: iOS bundle
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          xcrun --sdk iphonesimulator --show-sdk-path
          make ios

      # `make testflight` archives Moomux.xcodeproj, which nothing else builds
      # before merge: a broken project file or a source missing from it fails
      # only after the release cask is out. Same env scrub as the Makefile's
      # XCODEBUILD (xcodebuild reads the environment as build settings).
      - name: Xcode project builds
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          env -u SDKROOT xcodebuild -project Moomux.xcodeproj -scheme Moomux \
            -destination 'generic/platform=iOS Simulator' \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO build

  # Plain bash and git, no macOS toolchain, so it skips the macOS runner.
  version-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release version rules
        run: ./Scripts/next_version_test.sh

  # Same gate release.yml and testflight.yml run after merge: a pin under 72
  # hours old should fail the PR that adds it. Needs only gh, jq and yq, so it
  # skips the macOS runner. An urgent fix runs the script by hand with
  # MIN_AGE_HOURS=0, or dispatches Release with min_age_hours.
  dependency-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse dependencies under 72 hours old
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/dependency_age.sh

  # shellcheck ships on the ubuntu runner image.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck Scripts
        run: shellcheck --severity=warning Scripts/*.sh
