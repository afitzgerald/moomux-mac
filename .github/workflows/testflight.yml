# Archive and upload the iPhone app to TestFlight from a runner instead of a
# laptop. Same `make testflight` as locally; the only thing CI adds is the
# credential a laptop gets from Xcode ▸ Settings ▸ Accounts, handed over as
# XC_AUTH.
#
# Release calls this with the tag it just shipped to the cask, so every brew
# release has a TestFlight build of the same commit under the same version.
# Dispatching it by hand still works, and builds whatever branch it is run on.
#
# iPhone only. The Mac app ships through release.yml and the cask; when it joins
# TestFlight it goes on the same App Store Connect record (the shared bundle id
# is what allows that) and this grows a platform input, as MergeRight's did.
name: TestFlight

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (vX.Y.Z); release.yml has already validated it"
        type: string
        required: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Same stamp release.yml gives the Mac plist, so the TestFlight build and
      # the cask report one version. The build number is XC_BUILD's, unchanged.
      - name: Stamp iOS version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" Resources/iOS-Info.plist

      # The image ships several Xcodes and the default may be older than the
      # project format. Pick the newest and print it, so "this Xcode is too old"
      # says so instead of looking like a code error. Passed as XCODE rather
      # than `xcode-select`ed, so the macOS steps of the build (the icon
      # rasterizer) stay on the toolchain they always use.
      - name: Pick Xcode
        id: xcode
        run: |
          dir="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          DEVELOPER_DIR="$dir" xcodebuild -version
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # With -allowProvisioningUpdates and an *Admin*-role key the export is
      # cloud signing: Apple mints the distribution certificate and profile and
      # the key authenticates the upload. No *distribution* .p12 on purpose — an
      # automatic export ignores the local keychain, so importing one only looks
      # like signing. The archive is the other half, and it does read the
      # keychain: see the next step.
      # An App Manager key archives fine and then fails at export with what
      # reads like a missing profile (MergeRight learned that twice).
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      # The archive signs with an Apple Development identity, and on a runner's
      # empty keychain -allowProvisioningUpdates mints a new one through the API
      # key on every run, whose private key the runner then throws away — one
      # leaked certificate per release until the account hits its limit and
      # every archive fails with "Choose a certificate to revoke" (MergeRight
      # #109). One identity imported here is reused instead. A missing secret
      # fails loudly: carrying on would quietly go back to minting.
      - name: Import the development certificate
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A pasted or piped secret can carry a stray return, which fails only as
          # "passphrase not correct". Base64 has no whitespace and a password no
          # line break, so strip both (MergeRight #111).
          P12=$(printf '%s' "$DEV_CERT_P12" | tr -d ' \t\r\n')
          PW=${DEV_CERT_PASSWORD%%[$'\r\n']*}
          if [ -z "$P12" ]; then
            echo "::error::DEV_CERT_P12 is not set — one Apple Development identity, .p12, base64"
            exit 1
          fi
          KC="$RUNNER_TEMP/dev.keychain-db"
          KC_PW=$(openssl rand -base64 24)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dev.p12" -P "$PW" -f pkcs12 -k "$KC" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          # Prepend, keeping the login keychain, or xcodebuild never sees it.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dev.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Upload the iPhone build
        run: |
          make testflight XCODE="${{ steps.xcode.outputs.dir }}" \
            XC_AUTH="-authenticationKeyPath $RUNNER_TEMP/asc.p8 \
              -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
              -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}"

      - name: Shred the credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/dev.p12"
          security delete-keychain "$RUNNER_TEMP/dev.keychain-db" 2>/dev/null || true
