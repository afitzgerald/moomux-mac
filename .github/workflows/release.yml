name: Release

on:
  push:
    tags:
      - "v*"
  # Deploy pushes release tags using the default GITHUB_TOKEN, and pushes
  # authenticated that way don't trigger other workflows (a deliberate
  # GitHub anti-recursion rule) — so the `push: tags` trigger above never
  # fires for automated tags. Deploy calls this dispatch instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # Needs a real Mac: swift build produces a Mach-O binary, and codesign /
    # notarytool / stapler only exist on macOS.
    runs-on: macos-15
    steps:
      # workflow_dispatch can be triggered manually with any string, and
      # inputs.tag feeds straight into checkout's ref: below — reject
      # anything that isn't an exact vX.Y.Z tag before it's used as a ref.
      - name: Validate tag input
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag input: $TAG (want vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_REF#v}" >> "$GITHUB_OUTPUT"

      # CFBundleShortVersionString is a plain string SwiftPM doesn't stamp
      # for us (no ldflags equivalent) — set it from the tag being released
      # so `make install`'s reported version and About panel agree with the
      # GitHub release and the cask.
      - name: Stamp Info.plist version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist

      # Imports the Developer ID cert into a throwaway keychain scoped to this
      # job. A random, job-local password is fine — the keychain never
      # outlives the runner. codesign/notarytool find it because `security
      # list-keychains` appends it to the search list.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # Produces dist/Moomux-<version>.dmg, signed with the Developer ID cert
      # just imported (DIST_IDENTITY picks it up automatically — see
      # Makefile) plus hardened runtime and a secure timestamp, both required
      # for notarization.
      - name: Build and sign DMG
        run: make dist

      - name: Notarize
        env:
          DMG: dist/Moomux-${{ steps.version.outputs.version }}.dmg
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Checksum
        id: archive
        run: |
          dmg="dist/Moomux-${{ steps.version.outputs.version }}.dmg"
          name="Moomux-${{ steps.version.outputs.tag }}.dmg"
          mv "$dmg" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.sha256" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Publish Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sha256="$(cut -d' ' -f1 "${{ steps.archive.outputs.name }}.sha256")"

          # `gh repo clone` authenticates through the gh binary itself, but a
          # plain `git push` afterwards uses git's own HTTP transport, which
          # has no credential helper in a headless runner. This registers gh
          # as that helper so the push below can actually authenticate.
          gh auth setup-git

          rm -rf /tmp/tap
          gh repo clone afitzgerald/homebrew-moomux-mac /tmp/tap
          mkdir -p /tmp/tap/Casks

          cat > /tmp/tap/Casks/moomux-mac.rb <<EOF
          cask "moomux-mac" do
            version "${VERSION}"
            sha256 "${sha256}"

            url "https://github.com/afitzgerald/moomux-mac/releases/download/${TAG}/Moomux-${TAG}.dmg"
            name "Moomux"
            desc "Native macOS front end for moomux"
            homepage "https://github.com/afitzgerald/moomux-mac"

            depends_on macos: :sonoma

            app "Moomux.app"

            zap trash: [
              "~/Library/Application Support/Moomux",
            ]
          end
          EOF

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/moomux-mac.rb
          git commit -m "moomux-mac ${TAG}"
          git push
