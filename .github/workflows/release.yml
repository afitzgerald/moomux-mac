name: Release

on:
  push:
    tags:
      - "v*"
  # Deploy pushes release tags using the default GITHUB_TOKEN, and pushes
  # authenticated that way don't trigger other workflows (a deliberate
  # GitHub anti-recursion rule) — so the `push: tags` trigger above never
  # fires for automated tags. Deploy calls this dispatch instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)"
        required: true
      min_age_hours:
        description: "Dependency cool-down in hours (default 72); 0 for an urgent fix, say why in the PR"
        required: false
        default: "72"

# Two merges close together must not race on the cask or on a release tag; the
# second waits for the first rather than cancelling it mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default; the release job asks for write, the TestFlight job
# gets none of it.
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    # Needs a real Mac: swift build produces a Mach-O binary, and codesign /
    # notarytool / stapler only exist on macOS. macos-26 specifically: macOS
    # only draws the Liquid Glass toolbar for a binary linked against the
    # macOS 26 SDK, so a macos-15 runner shipped a release whose toolbar
    # buttons lost their capsules while local `make dev` builds kept them.
    runs-on: macos-26
    steps:
      # workflow_dispatch can be triggered manually with any string, and
      # the tag feeds straight into checkout's ref: below — reject anything
      # that isn't an exact vX.Y.Z tag before it's used as a ref. A pushed
      # `v*` tag (v1.0-rc, v-evil) is checked the same way.
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag input: $TAG (want vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A step in the job that already ships, not a workflow of its own, so it
      # costs seconds rather than another runner. Nothing under 72 hours old
      # ships, and the build takes only what this checked: SWIFT_BUILD_FLAGS
      # on the notarize step stops it resolving past Package.resolved.
      - name: Refuse dependencies under 72 hours old
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours || '72' }}
        run: Scripts/dependency_age.sh

      - name: Resolve version
        id: version
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_REF#v}" >> "$GITHUB_OUTPUT"
          echo "name=Moomux-${TAG_REF}.dmg" >> "$GITHUB_OUTPUT"

      # A re-run after a failed cask push finds the release already published.
      # Building again would mint a different dmg (new timestamps) that the
      # cask's sha256 no longer matches, and `gh release create` would fail on
      # the existing tag. So skip build and create, and reuse the asset's own
      # checksum.
      - name: Look for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh release download "$TAG" --pattern '*.sha256' --dir .
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # CFBundleShortVersionString is a plain string SwiftPM doesn't stamp
      # for us (no ldflags equivalent) — set it from the tag being released
      # so `make install`'s reported version and About panel agree with the
      # GitHub release and the cask.
      - name: Stamp Info.plist version
        if: steps.existing.outputs.exists != 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist

      # The GitHub release's body, and the What's New baked into the app —
      # see Scripts/release_notes.sh. Baked in rather than fetched by the app:
      # it works offline and always matches the build. `make notarize` below
      # reads WHATS_NEW; testflight.yml runs the same script for the iPhone.
      - name: Generate release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Scripts/release_notes.sh "${{ steps.version.outputs.tag }}" "$RUNNER_TEMP"
          echo "WHATS_NEW=$RUNNER_TEMP/WhatsNew.md" >> "$GITHUB_ENV"
          # PR titles are untrusted: stop the runner reading `::cmd::` in them.
          token=$(uuidgen)
          echo "::stop-commands::$token"
          cat "$RUNNER_TEMP/WhatsNew.md"
          echo "::$token::"

      # Imports the Developer ID cert into a throwaway keychain scoped to this
      # job. A random, job-local password is fine — the keychain never
      # outlives the runner. codesign/notarytool find it because `security
      # list-keychains` appends it to the search list.
      - name: Import signing certificate
        if: steps.existing.outputs.exists != 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # A stray return in either secret fails only as "passphrase not
          # correct"; base64 has no whitespace and a password no line break.
          P12_BASE64=$(printf '%s' "$P12_BASE64" | tr -d ' \t\r\n')
          P12_PASSWORD=${P12_PASSWORD%%[$'\r\n']*}
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # Produces dist/Moomux-<version>.dmg: signed with the Developer ID cert
      # just imported (DIST_IDENTITY picks it up automatically — see Makefile)
      # plus hardened runtime and a secure timestamp, then notarized and
      # stapled twice over — the .app first, the image around it second. Both
      # tickets matter and the Makefile explains why; CI does not repeat the
      # sequence, it just supplies the credentials, since a second copy of it
      # is exactly how the app inside the image ended up unstapled.
      - name: Build, sign and notarize DMG
        if: steps.existing.outputs.exists != 'true'
        env:
          NOTARY_ARGS: >-
            --apple-id ${{ secrets.APPLE_ID }}
            --team-id ${{ secrets.APPLE_TEAM_ID }}
            --password ${{ secrets.APPLE_APP_PASSWORD }}
          SWIFT_BUILD_FLAGS: --only-use-versions-from-resolved-file
        run: make notarize

      - name: Checksum
        if: steps.existing.outputs.exists != 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mv "dist/Moomux-${{ steps.version.outputs.version }}.dmg" "$NAME"
          shasum -a 256 "$NAME" > "$NAME.sha256"

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "$NAME" \
            "$NAME.sha256" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          sha256="$(cut -d' ' -f1 "$NAME.sha256")"

          # `gh repo clone` authenticates through the gh binary itself, but a
          # plain `git push` afterwards uses git's own HTTP transport, which
          # has no credential helper in a headless runner. This registers gh
          # as that helper so the push below can actually authenticate.
          gh auth setup-git

          rm -rf /tmp/tap
          gh repo clone afitzgerald/homebrew-moomux-mac /tmp/tap
          mkdir -p /tmp/tap/Casks

          # Quoted, so the shell expands nothing in here: the comments' backticks
          # once ran `brew upgrade` on the runner and pasted its log into the
          # cask (0.0.154), which brew then could not parse. The three values
          # go in afterwards.
          cat > /tmp/tap/Casks/moomux-mac.rb <<'EOF'
          cask "moomux-mac" do
            version "@VERSION@"
            sha256 "@SHA256@"

            url "https://github.com/afitzgerald/moomux-mac/releases/download/@TAG@/Moomux-@TAG@.dmg"
            name "Moomux"
            desc "Native macOS front end for moomux"
            homepage "https://github.com/afitzgerald/moomux-mac"

            depends_on macos: :sonoma

            app "Moomux.app"

            # brew copies the downloaded image's quarantine record onto every
            # file of the installed bundle, so the first launch after *every*
            # install and upgrade is gated behind "Moomux is an app downloaded
            # from the Internet. Are you sure?" — nothing opens until someone
            # clicks through it, which reads as the app not launching. Worse
            # when the policy record for that path is stale (0.0.26, unstapled,
            # sat at /Applications): the process is spawned and killed ~2s
            # later with no window and, after the first time, no dialog either.
            #
            # The notarization ticket stapled *into* the bundle is what proves
            # provenance offline (see the Makefile's notarize target), so
            # dropping the xattr gives up nothing the staple isn't already
            # asserting — brew has already checked the image's sha256 against
            # the line above. `postflight_steps`, not the deprecated
            # `postflight` block; args are template-expanded, hence {{appdir}}.
            postflight_steps do
              run "/usr/bin/xattr",
                  args: ["-dr", "com.apple.quarantine", "{{appdir}}/Moomux.app"]
            end

            # On `brew upgrade`, brew quits a running app named here and reopens
            # the new build afterwards (after postflight, so the xattr is gone
            # by then). The directive is read from the *installed* cask, so the
            # first upgrade onto this stanza still leaves the old app running.
            # brew skips the quit when it is itself running inside the app (a
            # Moomux pane), since quitting would kill it.
            uninstall quit: "app.moomux.Moomux"

            zap trash: [
              "~/Library/Application Support/Moomux",
            ]
          end
          EOF
          sed -i '' -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${sha256}/g" -e "s/@TAG@/${TAG}/g" \
            /tmp/tap/Casks/moomux-mac.rb
          ruby -c /tmp/tap/Casks/moomux-mac.rb

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/moomux-mac.rb
          # A re-run writes the same cask: nothing to commit is not a failure.
          git diff --cached --quiet || git commit -m "moomux-mac ${TAG}"
          git push

  # After the cask, not beside it: a TestFlight build only goes out for a
  # release brew actually got, and a failed upload cannot hold the cask back.
  testflight:
    needs: release
    # generate-notes (release_notes.sh) needs contents: write; nothing else.
    permissions:
      contents: write
    uses: ./.github/workflows/testflight.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    # Only what the upload uses, not every secret in the repo (the cask token,
    # the Developer ID certificate).
    secrets:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
      DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
